{% set name = "pygenn-cuda" %}
{% set version = "5.2.0" %}

package:
  name: {{ name }}
  version: {{ version }}

# source:
#   git_url: https://github.com/genn-team/genn.git
#   git_rev: master  # or pin to a tag like v5.2.0

source:
  path: F:\Windows\pygenn-win-nmake-prfix\genn

build:
  number: 0
  string: "py{{ PY_VER | replace('.', '') }}_cuda{{ cuda_version | replace('.', '') }}_{{ PKG_BUILDNUM }}"
  script_env:
    - CUDA_PATH
    - CudaLibraryPath  # [win]
  script: |
    {% if win %}
    :: --- Windows (Conda modular CUDA 12.9; NMake backend) ---
    :: NVCC lives under %BUILD_PREFIX%\bin in modular CUDA 12.9
    set "CUDA_PATH=%BUILD_PREFIX%"

    :: Let NMake/link find CUDA libs
    set "CudaLibraryPath=%BUILD_PREFIX%\Library\lib"

    :: CUDA 12.9 headers:
    ::   - targets\x86_64-windows\include  -> cuda.h, driver headers
    ::   - include                         -> nv/target, libcudacxx, CRT bits
    ::   - Library\include                 -> cudart & friends
    set "INCLUDE=%BUILD_PREFIX%\targets\x86_64-windows\include;%BUILD_PREFIX%\include;%BUILD_PREFIX%\Library\include;%INCLUDE%"

    :: Library search (add targets lib for completeness)
    set "LIB=%BUILD_PREFIX%\Library\lib;%BUILD_PREFIX%\targets\x86_64-windows\lib;%LIB%"

    :: Make nvcc and CUDA DLLs visible
    set "PATH=%BUILD_PREFIX%\bin;%BUILD_PREFIX%\Library\bin;%PATH%"

    "%PYTHON%" setup.py install --single-version-externally-managed --record=record.txt
    {% else %}
    # --- Linux (Conda modular CUDA) ---
    export CUDA_PATH="${BUILD_PREFIX}"
    export PATH="${BUILD_PREFIX}/bin:${PATH}"
    $PYTHON setup.py install --single-version-externally-managed --record=record.txt
    {% endif %}




requirements:
  build:
    - {{ compiler('cxx') }}
    - make                     # [linux]
    - python
    - setuptools
    - pybind11
    - psutil
    - vs2022_win-64            # [win]
    - cuda-nvcc {{ cuda_nvcc }}
    - cuda-cudart-dev {{ cuda_cudart_dev }}
    - cuda-libraries-dev {{ cuda_libraries_dev }}

  host:
    - python
    - numpy
    - psutil
    - pybind11
    - cuda-cudart-dev {{ cuda_cudart_dev }}


  run:
    - python
    - numpy
    - psutil
    - make                     # [linux] runtime codegen
    - {{ compiler('cxx') }}    # [linux] required to compile generated code
    - cuda-version =={{ cuda_version }}
    - cuda-nvcc {{ cuda_nvcc }}
    - cuda-cudart-dev {{ cuda_cudart_dev }}
    - cuda-libraries-dev {{ cuda_libraries_dev }}
    - cuda-cudart {{ cuda_cudart }}
    - cuda-libraries {{ cuda_libraries }}
    - importlib-metadata  # [py<38]


test:
  imports:
    - pygenn
  # Run the smoketest script
  commands:
    - python $RECIPE_DIR/tests/run_pygenn_cuda_smoketest.py    
   

about:
  home: https://github.com/genn-team/genn
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "GeNN Python bindings (pygenn) with CUDA backend support"
  description: |
    GeNN (GPU enhanced Neuronal Networks) is a code generation framework for
    accelerating spiking neural network simulations using GPUs.
    This package provides the Python bindings to use GeNN in Python and expects a CUDA-capable environment.
  dev_url: https://github.com/genn-team/genn

extra:
  recipe-maintainers:
    - Agrim-P777
    - tnowotny
    - neworderofjamie

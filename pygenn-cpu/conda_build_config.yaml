python:
  - 3.11

# Compilers per platform
c_compiler:
  - gcc      # [linux]
  - clang    # [osx]

cxx_compiler:
  - gxx      # [linux]
  - clangxx  # [osx]
  - vs2022   # [win]

# macOS universal matrix
macos_machine:
  - x86_64   # [osx]
  - arm64    # [osx]

# macOS minimum OS targets (good defaults for conda-forge toolchain)
MACOSX_DEPLOYMENT_TARGET:
  - 10.13    # [osx and x86_64]
  - 11.0     # [osx and arm64]

# Keep machine and deployment target paired (avoid cartesian product)
zip_keys:
  - - macos_machine
    - MACOSX_DEPLOYMENT_TARGET


# Use the SDK provided by the compilers on macOS
CONDA_BUILD_SYSROOT:
  - ${CONDA_BUILD_SYSROOT}  # [osx]

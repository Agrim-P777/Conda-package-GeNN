package:
  name: pygenn-cpu
  version: "5.2.0"

source:
  git_url: https://github.com/genn-team/genn.git
  git_rev: master  

build:
  number: 0
  script: |
    unset CUDA_PATH
    $PYTHON setup.py install --single-version-externally-managed --record=record.txt
  skip: true  # [not linux]

requirements:
  build:
    - {{ compiler('cxx') }}
    - make
    - python
    - setuptools
    - pybind11
    - psutil

  host:
    - python
    - numpy
    - psutil
    - pybind11

  run:
    - python
    - numpy
    - psutil
    - importlib-metadata  # [py<38]

test:
  imports:
    - pygenn

about:
  home: https://github.com/genn-team/genn
  license: MIT
  license_file: LICENSE
  summary: "CPU-only PyGeNN"
  description: |
    GeNN with single-threaded CPU backend only. No CUDA required.
  dev_url: https://github.com/genn-team/genn

extra:
  recipe-maintainers:
    - to-be-decided

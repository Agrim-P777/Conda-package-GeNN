# Python & NumPy matrix
python:
  - 3.11
numpy:
  - 2.0

# Compilers per-platform
cxx_compiler:
  - vs2022  # [win]
  - gxx     # [linux]
  - clangxx # [osx]

# Windows toolchain
vc:
  - 14      # [win]

# Linux GCC pin 
gcc:
  - 11      # [linux]

# Build targets (produce osx-64 and osx-arm64 packages)
target_platform:
  - win-64      # [win]
  - linux-64    # [linux]
  - osx-64      # [osx and x86_64]
  - osx-arm64   # [osx and arm64]

# macOS deployment targets (keep conservative + compatible)
macosx_deployment_target:
  - 10.13  # [osx and x86_64]
  - 11.0   # [osx and arm64]
